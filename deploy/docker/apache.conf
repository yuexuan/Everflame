<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
        FallbackResource /index.php
    </Directory>
    <DirectoryMatch "(^|/)\.">
        Require all denied
    </DirectoryMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
